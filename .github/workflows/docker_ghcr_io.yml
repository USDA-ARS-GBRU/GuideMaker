name: Publish Docker images

on:
  push:
    branches:
      - 'main'
    # Triggers the workflow whenever a semantic version tag is pushed (e.g., v1.2.3)
    tags:
      - 'v*.*.*'
  # Enables the manual "Run workflow" button in the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # We must check out the code so the metadata engine can read your Git reference states
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Required to emulate the ARM64 environment during cross-compilation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Sets up the Buildx builder instance capable of handling multi-arch builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # EXTRACT METADATA & GENERATE SEMVER TAGS
      # ------------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/usda-ars-gbru/guidemaker-avx
          tags: |
            # If a Git tag like v1.2.3 is pushed, generate: :1.2.3, :1.2, :1, and :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Fallback tracking tag for standard branch commits
            type=sha,prefix=sha-,format=short

      # ------------------------------------------------------------------------
      # BUILD AND PUSH MULTI-ARCH CONTAINER
      # ------------------------------------------------------------------------
      - name: Build and push GuideMaker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker-images/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
