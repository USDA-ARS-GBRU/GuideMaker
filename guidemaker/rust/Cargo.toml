[package]
name = "guidemaker-scan"
version = "0.1.0"
edition = "2021"

[lib]
name = "guidemaker_scan"
path = "src/lib.rs"

[[bin]]
name = "guidemaker-scan"
path = "src/main.rs"

[[bin]]
name = "guidemaker-step2"
path = "src/bin/step2.rs"

[[bin]]
name = "guidemaker-step3"
path = "src/bin/step3.rs"

[[bin]]
name = "benchmark-human-scale"
path = "src/bin/benchmark_human_scale.rs"

[dependencies]
bio = "4.0"
polars = { version = "0.43.0", features = ["csv", "parquet", "dtype-categorical", "lazy", "strings"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
hashbrown = { version = "0.14.5", features = ["raw"] }
fxhash = "0.2"
flate2 = "1.0"
zstd = "0.13"
rayon = "1.10"
sysinfo = "0.30"
rand = "0.10.3"
arrow-array   = "60.0.0"
arrow-schema  = "60.0.0"
parquet       = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
once_cell = "1"
[dev-dependencies]
tempfile = "3"
